name: Validate and update hosts

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *' # 04:17 UTC; independent of the NAS power schedule.

permissions:
  contents: read

concurrency:
  group: hosts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, pinned 2026-10-22
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/update_hosts.py --check

  update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, pinned 2026-10-22
      - name: Generate and verify the new list
        run: |
          python3 scripts/update_hosts.py
          python3 scripts/update_hosts.py --check
      - name: Publish changed generated files
        run: |
          git add -- hosts source.json README.md
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update hosts from StevenBlack'
          git push
